<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1f" />
    <title>Daily stats — ELIMINATOR SENSI GENERATOR</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <canvas id="fx-canvas" aria-hidden="true"></canvas>
    <main class="shell">
      <section class="card glass wide-card">
        <header class="hero">
          <div class="badge">ELIMINATOR</div>
          <h1 class="title">Daily analytics</h1>
          <p class="subtitle">See how many unique people visited and generated Sensei each day.</p>
        </header>
        <div class="form">
          <div>
            <p class="hint">These numbers are stored locally in this browser. No database or external connection is required.</p>
            <p id="stats-msg" class="msg" role="status" aria-live="polite"></p>
          </div>
          <div id="stats-content" hidden>
            <div class="stats-table-wrap">
              <table class="stats-table">
                <thead><tr><th>Date</th><th>Visitors</th><th>Unique generators</th><th>Generations</th></tr></thead>
                <tbody id="stats-body"></tbody>
              </table>
            </div>
            <div class="actions">
              <button id="stats-refresh" class="btn glow" type="button">Refresh</button>
              <a class="btn" href="./app.html">Back to generator</a>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="./assets/fx.js"></script>
    <script src="./assets/analytics.js"></script>
    <script src="./assets/stats.js"></script>
  </body>
</html>
