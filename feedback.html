<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1f" />
    <title>Feedback — ELIMINATOR SENSI GENERATOR</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <canvas id="fx-canvas" aria-hidden="true"></canvas>
    <main class="shell">
      <section class="card glass narrow-card">
        <header class="hero">
          <div class="badge">ELIMINATOR</div>
          <h1 class="title">Send feedback</h1>
          <p class="subtitle">Tell us what worked, what did not, or what you would like added.</p>
        </header>
        <form id="feedback-form" class="form">
          <label class="label" for="feedback-name">Your name (optional)</label>
          <input id="feedback-name" class="input full-input" maxlength="80" autocomplete="name" />
          <label class="label" for="feedback-message">Feedback</label>
          <textarea id="feedback-message" class="output feedback-input" maxlength="1500" required placeholder="Write your feedback here…"></textarea>
          <div class="actions">
            <button class="btn primary" type="submit">Open WhatsApp</button>
            <a class="btn" href="./index.html">Back to generator</a>
          </div>
          <p id="feedback-msg" class="msg" role="status" aria-live="polite"></p>
          <p class="hint">WhatsApp will open with your message addressed to the support number. You still control whether it is sent.</p>
        </form>
      </section>
    </main>
    <script src="./assets/fx.js"></script>
    <script src="./assets/analytics.js"></script>
    <script src="./assets/feedback.js"></script>
  </body>
</html>
