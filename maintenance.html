<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b16" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Under Maintenance — ELIMINATOR</title>
    <style>
      :root{color-scheme:dark;--ink:#eaf1ff;--muted:rgba(234,241,255,.68);--blue:#2f7bff;--red:#ff3a3a}
      *{box-sizing:border-box}html,body{min-height:100%;margin:0}
      body{display:grid;place-items:center;overflow:hidden;padding:24px;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:radial-gradient(900px 500px at 18% 18%,rgba(47,123,255,.24),transparent 65%),radial-gradient(800px 460px at 84% 84%,rgba(255,58,58,.22),transparent 64%),linear-gradient(135deg,#050815,#0b1024 55%,#070914)}
      .orb{position:fixed;width:36vmax;height:36vmax;border-radius:50%;filter:blur(2px);opacity:.18;pointer-events:none;animation:drift 12s ease-in-out infinite alternate}.orb.one{top:-18vmax;left:-10vmax;background:var(--blue)}.orb.two{right:-15vmax;bottom:-18vmax;background:var(--red);animation-delay:-4s}
      .card{position:relative;width:min(760px,100%);padding:clamp(28px,6vw,64px);text-align:center;border:1px solid rgba(255,255,255,.16);border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.035));box-shadow:0 30px 100px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.10);backdrop-filter:blur(18px);animation:rise .8s cubic-bezier(.23,1,.32,1)}
      .badge{display:inline-flex;align-items:center;gap:9px;padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);color:rgba(234,241,255,.88);font-size:12px;font-weight:900;letter-spacing:.16em}.badge:before{content:"";width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--red));box-shadow:0 0 20px rgba(47,123,255,.7)}
      h1{margin:24px 0 12px;font-size:clamp(32px,7vw,64px);line-height:1.02;letter-spacing:.02em}p{margin:0 auto;max-width:48ch;color:var(--muted);font-size:clamp(15px,2vw,18px);line-height:1.65}.status{display:inline-flex;align-items:center;gap:9px;margin-top:28px;padding:12px 16px;border:1px solid rgba(255,255,255,.12);border-radius:15px;background:rgba(0,0,0,.16);color:rgba(234,241,255,.78);font-size:13px;font-weight:700}.status i{display:block;width:8px;height:8px;border-radius:50%;background:#ffc857;box-shadow:0 0 14px rgba(255,200,87,.8);animation:pulse 1.5s ease-in-out infinite}
      .foot{margin-top:26px;color:rgba(234,241,255,.42);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
      @keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes drift{to{transform:translate3d(5vw,4vh,0) scale(1.12)}}@keyframes pulse{50%{opacity:.45;transform:scale(.7)}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </head>
  <body>
    <div class="orb one"></div><div class="orb two"></div>
    <main class="card" role="main">
      <div class="badge">ELIMINATOR</div>
      <h1>Under maintenance</h1>
      <p>We are updating the website right now. The generator, uploads, analytics, and other pages are temporarily unavailable. Please check back soon.</p>
      <div class="status"><i></i> Maintenance in progress</div>
      <div class="foot">Access will return after the update is complete</div>
    </main>
  </body>
</html>
